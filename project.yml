name: RillArchitectureSample
options:
  bundleIdPrefix: com.example
  developmentLanguage: ja
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.4"
    # ストアも View も MainActor で動かす。宣言ごとに @MainActor を書かない。
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  Rill:
    path: Packages/Rill
targets:
  RillArchitectureSample:
    type: application
    platform: iOS
    sources:
      - path: RillArchitectureSample
    dependencies:
      - package: Rill
        product: Rill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rill-architecture-sample
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: RillArchitectureSample
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  RillArchitectureSampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RillArchitectureSampleTests
    dependencies:
      - target: RillArchitectureSample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rill-architecture-sample.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  RillArchitectureSample:
    build:
      targets:
        RillArchitectureSample: all
    test:
      targets:
        - RillArchitectureSampleTests
        - package: Rill/RillTests
